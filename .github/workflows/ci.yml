name: CI

# `push` só na branch default; todo o resto é coberto por `pull_request`.
#
# Com `push: ['**']` e `pull_request` juntos, cada commit de uma branch com PR
# aberto dispara DOIS runs completos do mesmo SHA. O `concurrency` abaixo NÃO
# deduplica: a chave usa `github.ref`, que é `refs/heads/<branch>` no push e
# `refs/pull/<n>/merge` no pull_request — grupos diferentes, zero cancelamento.
# Medido em repo gerado: o mesmo SHA com um run `success` e outro `failure`.
#
# Remover `pull_request` também mataria a duplicação, mas deixaria PR de fork sem
# CI nenhum (o push do fork não dispara no repo base) — e este template é público.
# Fixado por teste: src/ci-wiring.test.ts
on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  REGISTRY: ghcr.io
  IMAGE_NAME: desenrolai/${{ github.event.repository.name }}

# Runner: hospedado por padrão, trocável por variável de repositório.
#
# Este template é PÚBLICO — em repo público o Actions hospedado é gratuito, e
# apontar self-hosted aqui deixaria um PR de fork executar código de terceiro
# dentro do cluster. O repo GERADO é privado: lá a cota hospedada é paga e, com
# billing bloqueado, o job FALHA em ~2s sem executar nenhum step. Zero steps não
# basta como assinatura — job `skipped` também tem zero; o separador é a
# conclusão: `failure` em ~2s é billing, `skipped` é o `if:` do job.
# Por isso o repo gerado define as variáveis abaixo.
#
#   CI_RUNNER         → ex.: ["self-hosted","desenrolai"]
#   CI_RUNNER_DOCKER  → ex.: ["self-hosted","docker-builder"]
#
# `fromJSON` é obrigatório: `runs-on` com a string 'self-hosted,desenrolai' vira
# UM label contendo vírgula — não dois — e o job fica em `queued` para sempre.
# Sem a variável, `vars.X` é string vazia (falsy) e sobra '"ubuntu-latest"',
# que o fromJSON devolve como o label hospedado.

jobs:
  ci:
    name: Lint / Typecheck / Test / Build
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker-build:
    name: Docker build (PR, sem push)
    # Sem este job, um Dockerfile quebrado atravessa o PR inteiro verde e só
    # aparece depois do merge — o job de push é `skipped` em pull_request.
    # Aqui a imagem é construída de verdade e não é publicada: sem login no
    # GHCR e sem `packages: write` (herda `contents: read` do topo).
    runs-on: ${{ fromJSON(vars.CI_RUNNER_DOCKER || '"ubuntu-latest"') }}
    needs: ci
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (sem push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker:
    name: Build & Push image
    runs-on: ${{ fromJSON(vars.CI_RUNNER_DOCKER || '"ubuntu-latest"') }}
    needs: ci
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.repository.default_branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
